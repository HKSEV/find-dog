# 백엔드 루트의 .env 파일을 Properties 형식으로 읽기
spring.config.import=optional:file:./.env[.properties]

server.address=0.0.0.0
# Render 프록시가 https로 받은 요청을 https로 인식 (카카오 Redirect URI가 https로 만들어짐)
server.forward-headers-strategy=framework
spring.application.name=dog-backend

jwt.secret=${JWT_SECRET}
jwt.expiration-time=3600000

spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.url=jdbc:sqlite:./erp.finddog?foreign_keys=on&busy_timeout=5000
spring.datasource.username=root
spring.datasource.password=1234

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.hibernate.ddl-auto=update

# 카카오 로그인 (키는 git에 올리지 않는 application-oauth.yml 에 따로 둠, 예시: application-oauth.example.yml)
#spring.config.import=optional:classpath:application-oauth.yml
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_REST_API_KEY}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}
spring.security.oauth2.client.registration.kakao.client-name=Kakao
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,profile_image
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id
# 로그인 뒤 돌아갈 프런트 주소
app.frontend-url=${FRONTEND_URL:http://localhost:3000/group/one/1}
# API를 부를 수 있는 프런트 주소 (쉼표로 여러 개)
app.cors-origins=${CORS_ORIGINS:http://localhost:3000}
